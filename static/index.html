<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Platform - Real-Time Web Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.7);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn.active {
            background: var(--danger);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .transcript-box {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-bottom-left-radius: 2px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
        }

        .input-row button {
            width: auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voice AI Platform</h1>
            <p>Full-Duplex Real-Time Conversational Agent</p>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="controls">
            <div class="form-group">
                <label>Select Workflow Prompt</label>
                <select id="promptSelect">
                    <option value="sales_outbound">Sales Outbound (CloudScale AI)</option>
                    <option value="healthcare_appointment">Healthcare Appointment (Apex Clinic)</option>
                    <option value="customer_support_inbound">Customer Support (Nexus Telecom)</option>
                    <option value="banking_verification">Banking Fraud Verification (Vantage Bank)</option>
                </select>
            </div>

            <button class="btn" id="toggleCallBtn" onclick="toggleCall()">
                🎤 Start Voice Call
            </button>
        </div>

        <div class="transcript-box" id="transcriptBox">
            <div class="message assistant">System ready. Click "Start Voice Call" or send a text message below to begin.</div>
        </div>

        <div class="input-row">
            <input type="text" id="textInput" placeholder="Type a message or speak into mic..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="sendTextMessage()">Send</button>
        </div>
    </div>

    <script>
        let ws = null;
        let audioCtx = null;
        let mediaStream = null;
        let isCalling = false;
        let nextPlayTime = 0;

        async function toggleCall() {
            if (isCalling) {
                stopCall();
            } else {
                await startCall();
            }
        }

        async function startCall() {
            const promptId = document.getElementById('promptSelect').value;
            const sessionId = 'web-' + Math.random().toString(36).substring(2, 10);
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/voice/${sessionId}?prompt_id=${promptId}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus(true, "Connected & Ready");
                document.getElementById('toggleCallBtn').classList.add('active');
                document.getElementById('toggleCallBtn').innerHTML = '🔴 End Call';
                isCalling = true;
                addMessage("assistant", "Connected to Voice AI Agent. Speak into your microphone or type a message below...");
                startAudioCapture();
            };

            ws.onmessage = async (event) => {
                if (event.data instanceof Blob) {
                    const arrayBuffer = await event.data.arrayBuffer();
                    playSmoothPcmChunk(arrayBuffer);
                } else {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.text) {
                            addMessage(data.type === 'user_transcript' ? 'user' : 'assistant', data.text);
                        }
                    } catch(e){}
                }
            };

            ws.onclose = () => { stopCall(); };
            ws.onerror = () => { stopCall(); };
        }

        function stopCall() {
            if (ws) { ws.close(); ws = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            isCalling = false;
            updateStatus(false, "Disconnected");
            document.getElementById('toggleCallBtn').classList.remove('active');
            document.getElementById('toggleCallBtn').innerHTML = '🎤 Start Voice Call';
        }

        async function startAudioCapture() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                nextPlayTime = audioCtx.currentTime;
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(mediaStream);
                
                const processor = audioCtx.createScriptProcessor(2048, 1, 1);
                source.connect(processor);
                processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (!isCalling || !ws || ws.readyState !== WebSocket.OPEN) return;
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                    }
                    ws.send(pcm16.buffer);
                };
            } catch(e) {
                console.log("Mic access info:", e);
            }
        }

        function playSmoothPcmChunk(arrayBuffer) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                nextPlayTime = audioCtx.currentTime;
            }

            const pcm16 = new Int16Array(arrayBuffer);
            if (pcm16.length === 0) return;

            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }

            const buffer = audioCtx.createBuffer(1, float32.length, 16000);
            buffer.getChannelData(0).set(float32);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);

            const startTime = Math.max(audioCtx.currentTime, nextPlayTime);
            source.start(startTime);
            nextPlayTime = startTime + buffer.duration;
        }

        function sendTextMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            
            if (!isCalling) {
                startCall().then(() => {
                    setTimeout(() => sendRawText(text), 500);
                });
            } else {
                sendRawText(text);
            }
            input.value = '';
        }

        function sendRawText(text) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage("user", text);
                ws.send(JSON.stringify({ type: "text", text: text }));
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') { sendTextMessage(); }
        }

        function updateStatus(connected, text) {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            txt.innerText = text;
            if (connected) { dot.classList.add('connected'); }
            else { dot.classList.remove('connected'); }
        }

        function addMessage(sender, text) {
            const box = document.getElementById('transcriptBox');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
